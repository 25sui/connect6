<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>六子棋 - Connect6</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #8B4513;
            --secondary-color: #D2B48C;
            --accent-color: #CD5C5C;
            --text-color: #333333;
            --light-text: #666666;
            --background: #efe7d8;
            --panel-bg: #f7f1e6;
            --panel-border: #d5c4a7;
            --board-bg: #c9965c;
            --board-border: #6d4520;
            --shadow: rgba(92, 60, 28, 0.14);
            --shadow-hover: rgba(92, 60, 28, 0.22);
            --transition: all 0.22s ease;
            --gold: #d8b04e;
            --silver: #bfc3c8;
            --board-shadow: rgba(92, 60, 28, 0.2);
            --glass-bg: transparent;
            --glass-border: rgba(109, 69, 32, 0.14);
            --glass-shadow: 0 12px 28px rgba(92, 60, 28, 0.12);
            --border-radius: 14px;
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
            --font-size-xs: 12px;
            --font-size-sm: 14px;
            --font-size-md: 16px;
            --font-size-lg: 18px;
            --font-size-xl: 24px;
            --font-size-xxl: 32px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(180deg, #f3edde 0%, #e7dcc6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 28px 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><path d="M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z" fill="%238b4513" fill-opacity="0.05" fill-rule="evenodd"/></svg>'),
                radial-gradient(circle at 20% 80%, rgba(210, 180, 140, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(205, 92, 92, 0.1) 0%, transparent 50%);
            opacity: 0.18;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.06;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="140" height="140" filter="url(%23n)" opacity="0.55"/></svg>');
            mix-blend-mode: multiply;
        }
        
        .game-container {
            display: flex;
            gap: 28px;
            background: #fbf8f1;
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 20px 44px var(--shadow);
            position: relative;
            max-width: 1260px;
            width: 100%;
            border: 1px solid rgba(109, 69, 32, 0.1);
            transition: var(--transition);
        }
        
        .game-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #7e4d22, #b97a43, #7e4d22);
            border-radius: 24px 24px 0 0;
        }
        
        .game-container::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(139, 69, 19, 0.2), transparent);
        }
        
        .board-section {
            position: relative;
            flex: 0 0 auto;
        }
        
        /* 响应式布局 */
        .game-container {
            display: flex;
            gap: var(--spacing-lg);
            max-width: 1200px;
            margin: 0 auto;
            padding: 0;
            min-height: auto;
            align-items: flex-start;
            flex-wrap: wrap;
            background: #fbf8f1;
            box-shadow: none;
            border: none;
            justify-content: center;
        }
        
        @media (max-width: 900px) {
            .game-container {
                flex-direction: column;
                align-items: center;
                 padding: 20px;
             }
            
            .control-panel {
                width: 100%;
                max-width: 400px;
            }
            
            .board-wrapper {
                padding: 20px;
            }
            
            .board {
                grid-template-columns: repeat(19, 28px);
                grid-template-rows: repeat(19, 28px);
            }
            
            .cell {
                width: 28px;
                height: 28px;
            }
            
            .piece {
                width: 24px;
                height: 24px;
            }
        }
        
        @media (max-width: 600px) {
            .board-wrapper {
                padding: 15px;
            }
            
            .board {
                grid-template-columns: repeat(19, 24px);
                grid-template-rows: repeat(19, 24px);
            }
            
            .cell {
                width: 24px;
                height: 24px;
            }
            
            .piece {
                width: 20px;
                height: 20px;
            }
            
            .board-title {
                font-size: 32px;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
        }
        
        .board-header {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
            padding: 6px 0 14px;
        }
        
        .board-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 38px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 8px;
            text-shadow: none;
            position: relative;
            display: inline-block;
        }
        
        .board-title::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 68%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #b58559, transparent);
            border-radius: 2px;
        }
        
        .board-subtitle {
            font-size: 13px;
            color: #8f7a62;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
        }
        
        .board-wrapper {
            background: linear-gradient(180deg, #d7a36b, #bf8750);
            padding: 24px;
            border-radius: 18px;
            box-shadow: 
                inset 0 1px 0 rgba(255, 255, 255, 0.28),
                inset 0 -1px 0 rgba(82, 49, 17, 0.22),
                0 14px 24px var(--shadow);
            position: relative;
            transition: var(--transition);
        }
        
        .board-wrapper::before {
            content: '';
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 12px;
            pointer-events: none;
            background: none;
        }

        .board-wrapper::after {
            content: '';
            position: absolute;
            inset: 8px;
            border: 1px solid rgba(93, 57, 24, 0.14);
            border-radius: 14px;
            pointer-events: none;
        }
        
        .board {
            display: grid;
            grid-template-columns: repeat(19, 32px);
            grid-template-rows: repeat(19, 32px);
            gap: 0;
            position: relative;
            background: linear-gradient(180deg, #dcb27b, #d2a36d);
            border: 6px solid var(--board-border);
            border-radius: 10px;
            box-shadow: 
                inset 0 0 22px rgba(109, 69, 32, 0.18),
                0 8px 18px rgba(92, 60, 28, 0.18);
            overflow: hidden;
            position: relative;
        }
        
        .board::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(0deg, rgba(122, 78, 38, 0.045), rgba(122, 78, 38, 0.045)),
                repeating-linear-gradient(90deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 18px),
                repeating-linear-gradient(0deg, rgba(255,255,255,0.02) 0 1px, transparent 1px 18px);
            pointer-events: none;
        }
        
        .board::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                linear-gradient(135deg, rgba(255,255,255,0.03), rgba(0,0,0,0.03)),
                url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120"><filter id="wood"><feTurbulence type="fractalNoise" baseFrequency="0.015 0.22" numOctaves="2" seed="3"/></filter><rect width="120" height="120" filter="url(%23wood)" opacity="0.18"/></svg>');
            background-size: auto, 180px 180px;
            pointer-events: none;
        }
        
        .cell {
            width: 32px;
            height: 32px;
            position: relative;
            cursor: pointer;
            transition: background-color 0.16s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .cell::before,
        .cell::after {
            content: '';
            position: absolute;
            background: var(--board-border);
            opacity: 0.56;
        }
        
        .cell::before {
            width: 1px;
            height: 100%;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
        }
        
        .cell::after {
            width: 100%;
            height: 1px;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
        }
        
        /* 星位与天元 */
        .cell:nth-child(61)::before,
        .cell:nth-child(109)::before,
        .cell:nth-child(181)::before,
        .cell:nth-child(253)::before,
        .cell:nth-child(301)::before {
            width: 1px;
        }

        .cell:nth-child(61)::after,
        .cell:nth-child(109)::after,
        .cell:nth-child(181)::after,
        .cell:nth-child(253)::after,
        .cell:nth-child(301)::after {
            height: 1px;
        }

        .cell:nth-child(61)::before,
        .cell:nth-child(109)::before,
        .cell:nth-child(181)::before,
        .cell:nth-child(253)::before,
        .cell:nth-child(301)::before,
        .cell:nth-child(61)::after,
        .cell:nth-child(109)::after,
        .cell:nth-child(181)::after,
        .cell:nth-child(253)::after,
        .cell:nth-child(301)::after {
            opacity: 0.56;
        }
        
        .cell:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        
        .piece {
            position: absolute;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            transition: transform 0.18s ease;
            animation: placePiece 0.26s ease-out;
            position: relative;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.28);
        }
        
        @keyframes placePiece {
            0% {
                transform: translate(-50%, -50%) scale(0.82);
                opacity: 0;
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }
        
        .piece.black {
            background: radial-gradient(circle at 34% 28%, #595959, #131313 62%, #050505);
            box-shadow: 
                0 5px 10px rgba(0,0,0,0.42),
                inset -3px -3px 6px rgba(0,0,0,0.58),
                inset 3px 3px 6px rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.08);
        }
        
        .piece.black::after {
            content: '';
            position: absolute;
            top: 30%;
            left: 30%;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.3), rgba(255,255,255,0.1));
            pointer-events: none;
        }
        
        .piece.white {
            background: radial-gradient(circle at 34% 28%, #fffdf8, #ece5d8 62%, #ddd1bf);
            box-shadow: 
                0 5px 10px rgba(0,0,0,0.18),
                inset -3px -3px 6px rgba(108, 88, 56, 0.14),
                inset 3px 3px 6px rgba(255,255,255,0.86);
            border: 1px solid #d0c1ab;
        }
        
        .piece.white::after {
            content: '';
            position: absolute;
            top: 30%;
            left: 30%;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.8), rgba(255,255,255,0.4));
            pointer-events: none;
        }
        
        .piece:hover {
            transform: translate(-50%, -50%) scale(1.08);
            z-index: 20;
        }
        
        .piece.last-move {
            animation: none;
            position: relative;
        }
        
        .piece.last-move::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            background: #b44d35;
            border-radius: 50%;
            opacity: 0.82;
            z-index: -1;
        }
        
        .winning-line {
            background: rgba(180, 77, 53, 0.88);
            box-shadow: 0 0 0 1px rgba(255,255,255,0.15);
        }
        
        .control-panel {
            flex: 1;
            min-width: 280px;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 90vh;
            overflow-y: auto;
            padding-right: 4px;
            background: var(--panel-bg);
            border-radius: 18px;
            box-shadow: inset 0 0 0 1px rgba(109, 69, 32, 0.08);
            border: 1px solid var(--panel-border);
            padding: 14px;
        }
        
        .status-card {
            background: #fffdf8;
            border-radius: 14px;
            padding: 14px;
            text-align: left;
            box-shadow: 0 6px 14px rgba(92, 60, 28, 0.06);
            border: 1px solid rgba(109, 69, 32, 0.1);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }
        
        .status-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #7e4d22, #b58559, #7e4d22);
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .status-label {
            font-size: 14px;
            color: var(--light-text);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 500;
        }
        
        .status-value {
            font-family: 'Noto Serif SC', serif;
            font-size: 28px;
            font-weight: 700;
            padding: 10px 16px;
            border-radius: 10px;
            display: inline-block;
            position: relative;
            overflow: hidden;
        }
        
        .status-value.black-turn {
            background: linear-gradient(145deg, #333, #000);
            color: white;
            box-shadow: none;
        }
        
        .status-value.white-turn {
            background: linear-gradient(145deg, #fff, #e0e0e0);
            color: var(--text-color);
            box-shadow: none;
            border: 1px solid #ddd;
        }
        
        .status-value.winner {
            background: linear-gradient(145deg, #ffd700, #ffed4e);
            color: var(--text-color);
            animation: winnerPulse 1.2s infinite;
        }

        .move-info {
            margin-top: 10px;
            font-size: 14px;
            line-height: 1.5;
            color: #5f513f;
        }

        .ai-insight {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px dashed rgba(109, 69, 32, 0.16);
            font-size: 13px;
            line-height: 1.55;
            color: #7a6650;
        }

        .timer-card,
        .difficulty-selector,
        .history-panel,
        .stats-card,
        .info-card {
            background: #fffdf8;
            border-radius: 14px;
            border: 1px solid rgba(109, 69, 32, 0.1);
            box-shadow: 0 6px 14px rgba(92, 60, 28, 0.06);
            padding: 14px;
        }

        .timer-card,
        .history-panel,
        .stats-card,
        .info-card {
            transition: none;
        }

        .timer-header,
        .stats-title,
        .info-title,
        .difficulty-label {
            font-size: 12px;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #8b6f52;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .timer-container {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .timer-item {
            background: #f3ebdf;
            border: 1px solid rgba(109, 69, 32, 0.1);
            border-radius: 12px;
            padding: 10px 12px;
        }

        .timer-label {
            font-size: 12px;
            color: #7f6a54;
            margin-bottom: 6px;
        }

        .timer {
            font-family: 'Noto Serif SC', serif;
            font-size: 24px;
            color: #3f2d1b;
            background: transparent;
            padding: 0;
            min-width: auto;
            box-shadow: none;
            border: none;
        }

        .timer.warning {
            color: #b44d35;
        }

        .difficulty-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .difficulty-btn {
            border: 1px solid rgba(109, 69, 32, 0.14);
            background: #f4ede1;
            color: #5f513f;
            border-radius: 999px;
            padding: 8px 14px;
            font-size: 13px;
            transition: background-color 0.18s ease, color 0.18s ease, border-color 0.18s ease;
        }

        .difficulty-btn:hover {
            background: #ede1cf;
        }

        .difficulty-btn.active {
            background: #7d4c24;
            color: #fffaf2;
            border-color: #7d4c24;
        }

        .button-group {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 0;
        }

        .button-group + .button-group {
            margin-top: -2px;
        }

        .btn {
            justify-content: flex-start;
            min-width: 0;
            min-height: 42px;
            flex: none;
            padding: 11px 14px;
            border-radius: 12px;
            box-shadow: none;
            border: 1px solid rgba(109, 69, 32, 0.12);
            letter-spacing: 0.4px;
            text-transform: none;
            font-size: 14px;
        }

        .btn::before {
            display: none;
        }

        .btn-primary {
            background: #7d4c24;
            color: #fff9f1;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            background: #6e421e;
            box-shadow: 0 8px 18px rgba(92, 60, 28, 0.12);
        }

        .btn-secondary {
            background: #f3ebdf;
            color: #4e4130;
        }

        .btn-secondary:hover {
            transform: translateY(-1px);
            background: #eadfce;
            box-shadow: 0 8px 18px rgba(92, 60, 28, 0.08);
        }

        .btn:disabled {
            opacity: 0.48;
        }

        .history-panel {
            max-height: 220px;
        }

        .history-item {
            padding: 10px 12px;
            margin-bottom: 6px;
            background: #f5eee3;
            border-radius: 10px;
            font-size: 13px;
            transition: background-color 0.16s ease, transform 0.16s ease;
            cursor: pointer;
            border: 1px solid rgba(109, 69, 32, 0.08);
        }

        .history-item:hover {
            background: #eee2d1;
            transform: translateX(2px);
        }

        .history-item.active {
            background: #7d4c24;
            color: #fff8ef;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .stat-item {
            background: #f5eee3;
            border-radius: 12px;
            padding: 10px 12px;
            border: 1px solid rgba(109, 69, 32, 0.08);
        }

        .stat-value {
            font-family: 'Noto Serif SC', serif;
            font-size: 22px;
            color: #3f2d1b;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 12px;
            color: #7f6a54;
        }

        .info-list {
            padding-left: 18px;

        .button-group-primary .btn-primary {
            grid-column: span 2;
            justify-content: center;
            min-height: 46px;
            font-weight: 700;
        }

        .button-group-tools {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .btn {
            justify-content: flex-start;
            min-width: 0;
            flex: none;
            text-transform: none;
            letter-spacing: 0.4px;
            border-radius: 12px;
            border: 1px solid rgba(109, 69, 32, 0.12);
            box-shadow: none;
            font-size: 13px;
        }

        .btn::before {
            display: none;
        }

        .btn-primary {
            background: #7d4c24;
            color: #fff9f1;
        }

        .btn-primary:hover {
            background: #6e421e;
            transform: translateY(-1px) scale(1);
            box-shadow: 0 8px 18px rgba(92, 60, 28, 0.12);
        }

        .btn-secondary {
            background: #f3ebdf;
            color: #4e4130;
        }

        .btn-secondary:hover {
            background: #eadfce;
            transform: translateY(-1px) scale(1);
            box-shadow: 0 8px 18px rgba(92, 60, 28, 0.08);
        }

        .difficulty-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .difficulty-btn {
            flex: 1 1 auto;
            min-height: 40px;
            border-radius: 999px;
            background: #f4ede1;
            color: #5f513f;
            border: 1px solid rgba(109, 69, 32, 0.14);
            transform: none;
        }

        .difficulty-btn:hover {
            background: #ede1cf;
            color: #5f513f;
            transform: none;
        }

        .difficulty-btn.active {
            background: #7d4c24;
            color: #fffaf2;
            border-color: #7d4c24;
        }

        .move-info {
            margin-top: 10px;
            padding: 0;
            background: none;
            border-radius: 0;
            border-left: none;
            color: #5f513f;
            line-height: 1.5;
        }

        .ai-insight {
            margin-top: 12px;
            padding: 10px 0 0;
            background: none;
            border: none;
            border-top: 1px dashed rgba(109, 69, 32, 0.16);
            border-radius: 0;
            color: #7a6650;
        }

        .history-panel {
            max-height: 220px;
        }

        .history-title,
        .stats-title,
        .info-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.2px;
            text-transform: none;
        }

        .history-item {
            background: #f5eee3;
            border-radius: 10px;
            border: 1px solid rgba(109, 69, 32, 0.08);
            transition: background-color 0.16s ease, transform 0.16s ease;
        }

        .history-item:hover {
            background: #eee2d1;
            transform: translateX(2px);
        }

        .history-item.active {
            background: #7d4c24;
            color: #fff8ef;
        }

        .stats-card {
            color: inherit;
        }

        .stat-item {
            background: #f5eee3;
            border-radius: 12px;
            border: 1px solid rgba(109, 69, 32, 0.08);
        }

        .stat-value {
            color: #3f2d1b;

        .stat-label,
        .timer-label,
        .difficulty-label,
        .timer-header,
        .stats-title,
        .info-title {
            color: #8b6f52;
            letter-spacing: 1.2px;
            font-weight: 700;
        }

        .difficulty-label,
        .timer-label {
            text-transform: uppercase;
            font-size: 11px;
        }

        .timer-container {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .timer-item {
            background: #f3ebdf;
            border: 1px solid rgba(109, 69, 32, 0.1);
            border-radius: 12px;
            padding: 10px 12px;
        }

        .timer {
            background: transparent;
            box-shadow: none;
            border: none;
            color: #3f2d1b;
            padding: 0;
            min-width: auto;
        }

        .info-card::before,
        .info-title::before,
        .toast::before {
            animation: none;
        }

        .info-card::before {
            width: 3px;
            border-radius: 14px 0 0 14px;
        }

        .info-list {
            list-style: disc;
            padding-left: 18px;
            margin: 0;
        }

        .info-list li {
            display: list-item;
            padding: 6px 0;
            border-bottom: none;
            margin: 0;
            background: none;
            font-size: 14px;
        }

        .info-list li:hover {
            color: #5f513f;
            padding: 6px 0;
            margin: 0;
            background: none;
        }

        .info-list li::before {
            display: none;
        }

        .toast {
            background: rgba(44, 33, 22, 0.94);
            padding: 16px 18px;
            border-radius: 12px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.24);
            backdrop-filter: none;
            border-left: 3px solid #b58559;
            animation: slideIn 0.24s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(24px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @media (max-width: 600px) {
            .button-group {
                grid-template-columns: 1fr;
            }

            .button-group-primary .btn-primary {
                grid-column: auto;
            }

            .control-panel {
                max-width: 100%;
            }

            .timer-container,
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }

            .game-container {
                border-radius: 18px;
                padding: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="board-section">
            <div class="board-header">
                <h1 class="board-title">六子棋</h1>
                <p class="board-subtitle">静局对弈，落子见势</p>
            </div>
            <div class="board-wrapper">
                <div class="board" id="board"></div>
            </div>
        </div>
        
        <div class="control-panel">
            <div class="status-card">
                <div class="status-label">当前回合</div>
                <div class="status-value black-turn" id="status">黑棋</div>
                <div class="move-info" id="moveInfo">黑方第一手：下 1 子</div>
                <div class="ai-insight" id="aiInsight">AI决策说明：等待本回合分析</div>
            </div>
            
            <div class="timer-card">
                <div class="timer-header">时间限制</div>
                <div class="timer-container">
                    <div class="timer-item">
                        <div class="timer-label">黑方</div>
                        <div class="timer" id="blackTimer">10:00</div>
                    </div>
                    <div class="timer-item">
                        <div class="timer-label">白方</div>
                        <div class="timer" id="whiteTimer">10:00</div>
                    </div>
                </div>
            </div>

            <div class="settings-card">
                <div class="settings-title">对局设置</div>
                <div class="setting-row">
                    <div class="difficulty-label">AI难度</div>
                    <div class="difficulty-buttons">
                        <button class="difficulty-btn active" id="difficultyEasyBtn" onclick="setDifficulty('easy', this)">简单</button>
                        <button class="difficulty-btn" id="difficultyMediumBtn" onclick="setDifficulty('medium', this)">中等</button>
                        <button class="difficulty-btn" id="difficultyHardBtn" onclick="setDifficulty('hard', this)">困难</button>
                    </div>
                </div>
                <div class="setting-row">
                    <div class="difficulty-label">游戏模式</div>
                    <div class="difficulty-buttons">
                        <button class="difficulty-btn active" id="gameModeAiBtn" onclick="setGameMode('ai', this)">人机对战</button>
                        <button class="difficulty-btn" id="gameModeHumanBtn" onclick="setGameMode('human', this)">人人对战</button>
                    </div>
                </div>
                <div class="setting-row setting-row-compact">
                    <div class="difficulty-label">先后手</div>
                    <div class="difficulty-buttons">
                        <button class="difficulty-btn active" id="humanFirstBtn" onclick="setFirstPlayer('human')">人类先手</button>
                        <button class="difficulty-btn" id="aiFirstBtn" onclick="setFirstPlayer('ai')">AI先手</button>
                    </div>
                </div>
            </div>
            
            <div class="button-group button-group-primary">
                <button class="btn btn-primary" id="aiBtn" onclick="aiMove()">
                    <span>AI 走棋</span>
                </button>
                <button class="btn btn-secondary" onclick="restartGame()">
                    <span>重新开始</span>
                </button>
            </div>
            
            <div class="button-group button-group-tools">
                <button class="btn btn-secondary" onclick="exportGame()">
                    <span>导出棋谱</span>
                </button>
                <button class="btn btn-secondary" onclick="importGame()">
                    <span>导入棋谱</span>
                </button>
                <button class="btn btn-secondary" onclick="toggleNotation()">
                    <span>棋子标记</span>
                </button>
                <button class="btn btn-secondary" id="continueBtn" onclick="continueFromHistory()" disabled>
                    <span>从此继续</span>
                </button>
                <button class="btn btn-secondary" id="returnLatestBtn" onclick="returnToLatest()" disabled>
                    <span>返回最新</span>
                </button>
                <button class="btn btn-secondary" id="undoBtn" onclick="undoMove()" disabled>
                    <span>悔棋</span>
                </button>
            </div>
            
            <div class="history-panel">
                <div class="history-title">
                    <span>📋</span>
                    <span>历史记录</span>
                    <span class="history-mode-badge" id="historyModeBadge">当前局面</span>
                </div>
                <ul class="history-list" id="historyList"></ul>
            </div>
            
            <div class="stats-card">
                <div class="stats-title">局面概览</div>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-value" id="blackCount">0</div>
                        <div class="stat-label">黑棋数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="whiteCount">0</div>
                        <div class="stat-label">白棋数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="totalMoves">0</div>
                        <div class="stat-label">总步数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="turnCount">1</div>
                        <div class="stat-label">回合数</div>
                    </div>
                </div>
            </div>
            
            <div class="info-card">
                <div class="info-title">简要规则</div>
                <ul class="info-list">
                    <li>黑棋先行，首手仅落一子。</li>
                    <li>之后双方每回合各落两子。</li>
                    <li>任一方向先成六连即获胜。</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        // 游戏配置
        const BOARD_SIZE = 19;
        const WIN_COUNT = 6;
        
        // 游戏状态
        let board = [];
        let currentPlayer = 1; // 1: 黑棋, 2: 白棋
        let gameOver = false;
        let winner = null;
        let moveCount = 0; // 当前回合已下子数
        let totalMoveCount = 0; // 总步数
        let turnNumber = 1; // 回合数
        let lastMove = null; // 最后一步
        let aiDifficulty = 'easy'; // AI难度
        let moveHistory = []; // 移动历史记录
        let viewedHistoryIndex = null; // 历史浏览位置，null 表示当前对局
        let notationEnabled = false; // 棋子标记是否启用
        let firstPlayer = 'human'; // 先手方: human 或 ai
        let gameMode = 'ai'; // 游戏模式: ai 或 human
        let lastAIDecision = '等待本回合分析';
        
        // 时间限制相关
        let blackTime = 600; // 黑方时间（秒）
        let whiteTime = 600; // 白方时间（秒）
        let timerInterval = null; // 计时器间隔
        let isTimerRunning = false; // 计时器是否运行

        function updateModeButtons(selectedButton, buttonIds) {
            buttonIds.forEach(id => {
                const button = document.getElementById(id);
                if (button) {
                    button.classList.toggle('active', button === selectedButton);
                }
            });
        }

        function getAITurnPlayer() {
            return firstPlayer === 'ai' ? 1 : 2;
        }

        function isAITurn() {
            return gameMode === 'ai' && currentPlayer === getAITurnPlayer();
        }

        function getStonesPlayedInCurrentTurn(totalMoves) {
            if (totalMoves <= 0) {
                return 0;
            }

            if (totalMoves === 1) {
                return 1;
            }

            return totalMoves % 2 === 0 ? 1 : 2;
        }

        function isBrowsingHistory() {
            return viewedHistoryIndex !== null;
        }

        function updateHistoryModeBadge() {
            const badge = document.getElementById('historyModeBadge');
            if (!badge) {
                return;
            }

            if (isBrowsingHistory()) {
                badge.textContent = `浏览中: 第 ${viewedHistoryIndex + 1} 步`;
                badge.classList.add('browsing');
            } else {
                badge.textContent = '当前局面';
                badge.classList.remove('browsing');
            }
        }

        function updateAIInsight(message = lastAIDecision) {
            const insightEl = document.getElementById('aiInsight');
            if (!insightEl) {
                return;
            }

            insightEl.textContent = `AI决策说明：${message}`;
        }

        function updateActionButtons() {
            const aiButton = document.getElementById('aiBtn');
            const undoButton = document.getElementById('undoBtn');
            const continueButton = document.getElementById('continueBtn');
            const returnLatestButton = document.getElementById('returnLatestBtn');

            if (aiButton) {
                aiButton.disabled = gameMode !== 'ai' || gameOver || !isAITurn() || isBrowsingHistory();
            }

            if (undoButton) {
                undoButton.disabled = moveHistory.length === 0 || isBrowsingHistory();
            }

            if (continueButton) {
                continueButton.disabled = !isBrowsingHistory();
            }

            if (returnLatestButton) {
                returnLatestButton.disabled = !isBrowsingHistory();
            }
        }

        function validateMoveHistory(history) {
            if (!Array.isArray(history)) {
                throw new Error('无效的棋谱格式');
            }

            const seen = new Set();

            history.forEach((move, index) => {
                if (!move || !Number.isInteger(move.x) || !Number.isInteger(move.y)) {
                    throw new Error(`第${index + 1}步坐标无效`);
                }

                if (!isValid(move.x, move.y)) {
                    throw new Error(`第${index + 1}步超出棋盘范围`);
                }

                if (move.player !== 1 && move.player !== 2) {
                    throw new Error(`第${index + 1}步执子方无效`);
                }

                const key = `${move.x},${move.y}`;
                if (seen.has(key)) {
                    throw new Error(`第${index + 1}步与之前落子重复`);
                }

                seen.add(key);
            });
        }

        function rebuildStateFromHistory(history, upToIndex = history.length - 1) {
            board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(0));
            currentPlayer = 1;
            gameOver = false;
            winner = null;
            moveCount = 0;
            totalMoveCount = 0;
            turnNumber = 1;
            lastMove = null;

            if (upToIndex < 0) {
                return;
            }

            for (let i = 0; i <= upToIndex; i++) {
                const move = history[i];
                board[move.y][move.x] = move.player;
                lastMove = { x: move.x, y: move.y };
                totalMoveCount++;

                if (checkWin(move.x, move.y, move.player)) {
                    gameOver = true;
                    winner = move.player;
                }

                if (gameOver) {
                    currentPlayer = move.player;
                    moveCount = getStonesPlayedInCurrentTurn(totalMoveCount);
                    turnNumber = Math.floor(Math.max(totalMoveCount - 1, 0) / 2) + 1;
                    break;
                }

                const isFirstMove = totalMoveCount === 1;
                const shouldSwitch = isFirstMove || moveCount + 1 >= 2;

                if (shouldSwitch) {
                    currentPlayer = currentPlayer === 1 ? 2 : 1;
                    moveCount = 0;
                    if (currentPlayer === 1) {
                        turnNumber++;
                    }
                } else {
                    moveCount++;
                }
            }
        }
        
        // 初始化游戏
        function initGame() {
            board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(0));
            currentPlayer = 1;
            gameOver = false;
            winner = null;
            moveCount = 0;
            totalMoveCount = 0;
            turnNumber = 1;
            lastMove = null;
            moveHistory = [];
            viewedHistoryIndex = null;
            
            // 重置时间
            resetTimer();
            
            renderBoard();
            updateStatus();
            updateStats();
            updateHistory();
            updateActionButtons();
            updateHistoryModeBadge();
            updateAIInsight('等待本回合分析');
        }
        
        // 设置AI难度
        function setDifficulty(difficulty, button) {
            aiDifficulty = difficulty;
            updateModeButtons(button, ['difficultyEasyBtn', 'difficultyMediumBtn', 'difficultyHardBtn']);
            
            showMessage(`AI难度已设置为${difficulty === 'easy' ? '简单' : difficulty === 'medium' ? '中等' : '困难'}`);
        }
        
        // 设置游戏模式
        function setGameMode(mode, button) {
            gameMode = mode;
            updateModeButtons(button, ['gameModeAiBtn', 'gameModeHumanBtn']);
            
            // 显示AI相关控件
            const aiRelatedElements = [
                document.getElementById('humanFirstBtn')?.closest('.setting-row'),
                document.getElementById('aiBtn')
            ].filter(Boolean);
            if (mode === 'ai') {
                aiRelatedElements.forEach(el => el.style.display = 'block');
            } else {
                aiRelatedElements.forEach(el => el.style.display = 'none');
            }
            
            // 重新开始游戏
            restartGame();
            
            showMessage(`游戏模式已设置为${mode === 'ai' ? '人机对战' : '人人对战'}`);
        }
        
        // 设置先后手
        function setFirstPlayer(player) {
            firstPlayer = player;
            
            // 更新按钮状态
            document.getElementById('humanFirstBtn').classList.toggle('active', player === 'human');
            document.getElementById('aiFirstBtn').classList.toggle('active', player === 'ai');
            
            // 重新开始游戏
            restartGame();
            
            showMessage(`先后手已设置为${player === 'human' ? '人类先手' : 'AI先手'}`);
        }
        
        // 更新历史记录
        function updateHistory() {
            const historyList = document.getElementById('historyList');
            historyList.innerHTML = '';
            
            moveHistory.forEach((move, index) => {
                const li = document.createElement('li');
                li.className = 'history-item';
                if ((isBrowsingHistory() && viewedHistoryIndex === index) || (!isBrowsingHistory() && index === moveHistory.length - 1)) {
                    li.classList.add('active');
                }
                li.textContent = `第${index + 1}步: ${move.player === 1 ? '黑' : '白'} ${move.x},${move.y}`;
                li.onclick = () => jumpToMove(index);
                historyList.appendChild(li);
            });

            updateActionButtons();
            updateHistoryModeBadge();
        }
        
        // 悔棋
        function undoMove() {
            if (moveHistory.length === 0) return;

            stopTimer();

            moveHistory.pop();
            viewedHistoryIndex = null;
            rebuildStateFromHistory(moveHistory);
            
            renderBoard();
            updateStatus();
            updateStats();
            updateHistory();
            showMessage('已悔棋一步');
        }
        
        // 跳转到指定步数
        function jumpToMove(index) {
            stopTimer();

            viewedHistoryIndex = index;
            rebuildStateFromHistory(moveHistory, index);
              
            renderBoard();
            updateStatus();
            updateStats();
            updateHistory();
            showMessage(`已跳转到第${index + 1}步`);
        }

        function continueFromHistory() {
            if (!isBrowsingHistory()) return;

            stopTimer();
            moveHistory = moveHistory.slice(0, viewedHistoryIndex + 1);
            viewedHistoryIndex = null;
            rebuildStateFromHistory(moveHistory);

            renderBoard();
            updateStatus();
            updateStats();
            updateHistory();
            showMessage('已从当前历史节点继续对局');
        }

        function returnToLatest() {
            if (!isBrowsingHistory()) return;

            stopTimer();
            viewedHistoryIndex = null;
            rebuildStateFromHistory(moveHistory);

            renderBoard();
            updateStatus();
            updateStats();
            updateHistory();
            showMessage('已返回最新局面');
        }
        
        // 导出棋谱
        function exportGame() {
            const gameData = {
                boardSize: BOARD_SIZE,
                moveHistory: moveHistory,
                currentPlayer: currentPlayer,
                gameOver: gameOver,
                winner: winner,
                totalMoves: totalMoveCount,
                turnNumber: turnNumber,
                timestamp: new Date().toISOString()
            };
            
            const jsonString = JSON.stringify(gameData, null, 2);
            const blob = new Blob([jsonString], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `connect6_game_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            
            URL.revokeObjectURL(url);
            showMessage('棋谱已导出');
        }
        
        // 导入棋谱
        function importGame() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const gameData = JSON.parse(e.target.result);
                        validateMoveHistory(gameData.moveHistory);
                        
                        // 重置游戏
                        initGame();
                        
                        // 应用棋谱数据
                        moveHistory = gameData.moveHistory;
                        viewedHistoryIndex = null;
                        rebuildStateFromHistory(moveHistory);
                        
                        // 更新界面
                        renderBoard();
                        updateStatus();
                        updateStats();
                        updateHistory();
                        showMessage('棋谱已导入');
                    } catch (error) {
                        showMessage('导入失败: ' + error.message);
                    }
                };
                reader.readAsText(file);
            };
            
            input.click();
        }
        
        // 切换棋子标记
        function toggleNotation() {
            notationEnabled = !notationEnabled;
            renderBoard();
            showMessage(notationEnabled ? '棋子标记已启用' : '棋子标记已禁用');
        }
        
        // 时间限制相关函数
        function resetTimer() {
            // 停止当前计时器
            stopTimer();
            
            // 重置时间
            blackTime = 600;
            whiteTime = 600;
            
            // 更新计时器显示
            updateTimerDisplay();
        }
        
        function startTimer() {
            if (isTimerRunning) return;
            
            isTimerRunning = true;
            timerInterval = setInterval(() => {
                if (currentPlayer === 1) {
                    blackTime--;
                    if (blackTime <= 0) {
                        blackTime = 0;
                        stopTimer();
                        handleTimeout(1);
                    }
                } else {
                    whiteTime--;
                    if (whiteTime <= 0) {
                        whiteTime = 0;
                        stopTimer();
                        handleTimeout(2);
                    }
                }
                updateTimerDisplay();
            }, 1000);
        }
        
        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            isTimerRunning = false;
        }
        
        function updateTimerDisplay() {
            const blackTimerEl = document.getElementById('blackTimer');
            const whiteTimerEl = document.getElementById('whiteTimer');
            
            if (blackTimerEl) {
                blackTimerEl.textContent = formatTime(blackTime);
                blackTimerEl.className = `timer ${blackTime < 10 ? 'warning' : ''}`;
            }
            
            if (whiteTimerEl) {
                whiteTimerEl.textContent = formatTime(whiteTime);
                whiteTimerEl.className = `timer ${whiteTime < 10 ? 'warning' : ''}`;
            }
        }
        
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        function handleTimeout(player) {
            stopTimer();
            gameOver = true;
            winner = player === 1 ? 2 : 1;
            updateStatus();
            updateStats();
            updateActionButtons();
            showMessage(`${player === 1 ? '黑方' : '白方'}超时，对方获胜！`);
        }
        
        // 渲染棋盘
        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            
            for (let y = 0; y < BOARD_SIZE; y++) {
                for (let x = 0; x < BOARD_SIZE; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.x = x;
                    cell.dataset.y = y;
                    
                    if (!gameOver) {
                        cell.onclick = () => handleCellClick(x, y);
                    } else {
                        cell.onclick = null;
                    }
                    
                    if (board[y][x] !== 0) {
                        const piece = document.createElement('div');
                        piece.className = `piece ${board[y][x] === 1 ? 'black' : 'white'}`;
                        if (lastMove && lastMove.x === x && lastMove.y === y) {
                            piece.classList.add('last-move');
                        }
                        
                        // 添加棋子标记
                        if (notationEnabled) {
                            const notation = document.createElement('div');
                            notation.className = 'piece-notation';
                            
                            // 查找该位置的落子顺序
                            const moveIndex = moveHistory.findIndex(move => move.x === x && move.y === y);
                            if (moveIndex !== -1) {
                                notation.textContent = moveIndex + 1;
                                notation.style.color = board[y][x] === 1 ? 'white' : 'black';
                                piece.appendChild(notation);
                            }
                        }
                        
                        cell.appendChild(piece);
                    }
                    
                    boardEl.appendChild(cell);
                }
            }
        }
        
        // 处理点击
        function handleCellClick(x, y) {
            if (gameOver || board[y][x] !== 0) return;

            if (isBrowsingHistory()) {
                showMessage('当前处于历史浏览模式，请先点击“从此继续”');
                return;
            }
            
            // 人人对战模式：允许任何玩家点击
            if (gameMode === 'human') {
                // 开始当前玩家的计时器
                startTimer();
                makeMove(x, y);
                return;
            }
            
            // 人机对战模式：判断是否是人类回合
            const isHumanTurn = currentPlayer !== getAITurnPlayer();
            
            if (!isHumanTurn) {
                showMessage('现在是AI回合，请点击"AI走棋"按钮');
                return;
            }
            
            // 开始人类的计时器
            startTimer();
            
            makeMove(x, y);
        }
        
        // 落子
        function makeMove(x, y) {
            if (isBrowsingHistory()) {
                return;
            }

            // 停止当前计时器
            stopTimer();
            
            board[y][x] = currentPlayer;
            lastMove = { x, y };
            moveCount++;
            totalMoveCount++;
            
            // 记录移动历史
            moveHistory.push({ x, y, player: currentPlayer });
            
            renderBoard();
            updateHistory();
            
            // 检查获胜
            if (checkWin(x, y, currentPlayer)) {
                gameOver = true;
                winner = currentPlayer;
                highlightWinningLine(x, y, currentPlayer);
                updateStatus();
                updateStats();
                showMessage(`${currentPlayer === 1 ? '黑棋' : '白棋'}获胜！`);
                return;
            }
            
            // 检查平局
            if (totalMoveCount >= BOARD_SIZE * BOARD_SIZE) {
                gameOver = true;
                updateStatus();
                updateStats();
                showMessage('平局');
                return;
            }
            
            // 判断是否需要切换玩家
            // 规则：黑方第一手只下1子，之后每方每回合下2子
            const isFirstMove = totalMoveCount === 1;
            const shouldSwitch = isFirstMove || moveCount >= 2;
            
            if (shouldSwitch) {
                currentPlayer = currentPlayer === 1 ? 2 : 1;
                moveCount = 0;
                if (currentPlayer === 1) {
                    turnNumber++;
                }
                
                // 开始对方的计时器
                if (!gameOver) {
                    startTimer();
                }
            } else {
                // 继续当前玩家的计时器
                startTimer();
            }
            
            updateStatus();
            updateStats();
            updateActionButtons();
        }
        
        // 检查获胜
        function checkWin(x, y, player) {
            const directions = [
                [1, 0],   // 水平
                [0, 1],   // 垂直
                [1, 1],   // 对角线
                [1, -1]   // 反对角线
            ];
            
            for (const [dx, dy] of directions) {
                let count = 1;
                let positions = [[x, y]];
                
                // 正方向
                let nx = x + dx, ny = y + dy;
                while (isValid(nx, ny) && board[ny][nx] === player) {
                    count++;
                    positions.push([nx, ny]);
                    nx += dx;
                    ny += dy;
                }
                
                // 反方向
                nx = x - dx;
                ny = y - dy;
                while (isValid(nx, ny) && board[ny][nx] === player) {
                    count++;
                    positions.push([nx, ny]);
                    nx -= dx;
                    ny -= dy;
                }
                
                if (count >= WIN_COUNT) {
                    return positions;
                }
            }
            
            return null;
        }
        
        // 检查坐标是否有效
        function isValid(x, y) {
            return x >= 0 && x < BOARD_SIZE && y >= 0 && y < BOARD_SIZE;
        }
        
        // 高亮获胜线
        function highlightWinningLine(x, y, player) {
            const winningPositions = checkWin(x, y, player);
            if (!winningPositions) return;
            
            // 重新渲染，高亮获胜棋子
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            
            for (let y = 0; y < BOARD_SIZE; y++) {
                for (let x = 0; x < BOARD_SIZE; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.x = x;
                    cell.dataset.y = y;
                    
                    if (board[y][x] !== 0) {
                        const piece = document.createElement('div');
                        piece.className = `piece ${board[y][x] === 1 ? 'black' : 'white'}`;
                        
                        // 高亮获胜棋子
                        const isWinning = winningPositions.some(([wx, wy]) => wx === x && wy === y);
                        if (isWinning) {
                            piece.style.boxShadow = '0 0 25px #CD5C5C, 0 0 50px #CD5C5C';
                            piece.style.animation = 'pulse 0.6s infinite';
                        }
                        
                        cell.appendChild(piece);
                    }
                    
                    boardEl.appendChild(cell);
                }
            }
        }
        
        // AI走棋
        function aiMove() {
            if (gameOver || !isAITurn()) return;
            if (isBrowsingHistory()) return;
            
            document.getElementById('aiBtn').disabled = true;
            showMessage('AI正在思考...');
            
            // 开始AI的计时器
            startTimer();
            
            const moves = findBestMoves();
            
            if (moves.length > 0) {
                setTimeout(() => {
                    makeMove(moves[0].x, moves[0].y);
                     
                    if (!gameOver && isAITurn() && moveCount < 2) {
                        setTimeout(() => {
                            const moves2 = findBestMoves({ firstMove: moves[0] });
                            if (moves2.length > 0) {
                                makeMove(moves2[0].x, moves2[0].y);
                            }
                            updateActionButtons();
                        }, 800);
                    } else {
                        updateActionButtons();
                    }
                }, 1000);
            } else {
                updateActionButtons();
            }
        }

        function hasNearbyPiece(x, y, distance = 2) {
            for (let dy = -distance; dy <= distance; dy++) {
                for (let dx = -distance; dx <= distance; dx++) {
                    if (dx === 0 && dy === 0) continue;
                    const nx = x + dx;
                    const ny = y + dy;
                    if (isValid(nx, ny) && board[ny][nx] !== 0) {
                        return true;
                    }
                }
            }

            return false;
        }

        function isOpeningCandidate(x, y) {
            const centerX = Math.floor(BOARD_SIZE / 2);
            const centerY = Math.floor(BOARD_SIZE / 2);
            return Math.abs(x - centerX) <= 2 && Math.abs(y - centerY) <= 2;
        }

        function getCandidateMoves(limit = 14) {
            const candidates = [];
            const recentMoves = moveHistory.slice(-6);

            for (let y = 0; y < BOARD_SIZE; y++) {
                for (let x = 0; x < BOARD_SIZE; x++) {
                    if (board[y][x] !== 0) continue;

                    let isCandidate = totalMoveCount < 2 ? isOpeningCandidate(x, y) : hasNearbyPiece(x, y, 2);

                    if (!isCandidate && recentMoves.length > 0) {
                        isCandidate = recentMoves.some(move => Math.abs(move.x - x) <= 2 && Math.abs(move.y - y) <= 2);
                    }

                    if (isCandidate) {
                        candidates.push({ x, y });
                    }
                }
            }

            if (candidates.length === 0) {
                for (let y = 0; y < BOARD_SIZE; y++) {
                    for (let x = 0; x < BOARD_SIZE; x++) {
                        if (board[y][x] === 0) {
                            candidates.push({ x, y });
                        }
                    }
                }
            }

            if (candidates.length <= limit) {
                return candidates;
            }

            return candidates
                .map(move => ({ ...move, priority: evaluatePosition(move.x, move.y) }))
                .sort((a, b) => b.priority - a.priority)
                .slice(0, limit)
                .map(({ x, y }) => ({ x, y }));
        }

        function evaluateLinePattern(x, y, player, dx, dy) {
            let total = 1;
            let openEnds = 0;
            let jumpSupport = 0;

            for (let dir = -1; dir <= 1; dir += 2) {
                let nx = x + dx * dir;
                let ny = y + dy * dir;
                let count = 0;

                while (isValid(nx, ny) && board[ny][nx] === player) {
                    count++;
                    nx += dx * dir;
                    ny += dy * dir;
                }

                total += count;

                if (isValid(nx, ny) && board[ny][nx] === 0) {
                    openEnds++;

                    const jumpX = nx + dx * dir;
                    const jumpY = ny + dy * dir;
                    if (isValid(jumpX, jumpY) && board[jumpY][jumpX] === player) {
                        jumpSupport++;
                    }
                }
            }

            return { total, openEnds, jumpSupport };
        }

        function scorePattern(pattern, mode, isDefense = false) {
            const threatScale = isDefense
                ? (mode === 'easy' ? 1.35 : mode === 'medium' ? 1.2 : 1.1)
                : 1;

            let score = 0;

            if (pattern.total >= 6) score = 120000;
            else if (pattern.total === 5 && pattern.openEnds > 0) score = 25000;
            else if (pattern.total === 4 && pattern.openEnds === 2) score = 9000;
            else if (pattern.total === 4 && pattern.openEnds === 1) score = 3200;
            else if (pattern.total === 3 && pattern.openEnds === 2) score = 1200;
            else if (pattern.total === 3 && pattern.openEnds === 1) score = 360;
            else if (pattern.total === 2 && pattern.openEnds === 2) score = 120;
            else if (pattern.total === 2 && pattern.openEnds === 1) score = 45;
            else if (pattern.total === 1 && pattern.openEnds === 2) score = 10;

            if (pattern.jumpSupport > 0) {
                score += pattern.jumpSupport * (pattern.total >= 3 ? 180 : 60);
            }

            return Math.round(score * threatScale);
        }

        function scoreMoveSynergy(x, y, context) {
            if (!context || !context.firstMove) {
                return 0;
            }

            const { firstMove } = context;
            const dx = Math.abs(firstMove.x - x);
            const dy = Math.abs(firstMove.y - y);
            const sameLine = firstMove.x === x || firstMove.y === y || dx === dy;
            const distance = Math.max(dx, dy);

            let score = 0;

            if (sameLine) {
                score += 180;
            }

            if (distance <= 2) {
                score += 220;
            } else if (distance <= 4) {
                score += 90;
            } else if (distance >= 7) {
                score -= 120;
            }

            return score;
        }

        function evaluateOpponentBestResponse(limit = 3) {
            const aiPlayer = getAITurnPlayer();
            const opponentPlayer = aiPlayer === 1 ? 2 : 1;
            const candidateMoves = getCandidateMoves(8);
            let maxThreat = 0;

            for (const { x, y } of candidateMoves.slice(0, limit)) {
                board[y][x] = opponentPlayer;

                if (checkWin(x, y, opponentPlayer)) {
                    board[y][x] = 0;
                    return 100000;
                }

                maxThreat = Math.max(maxThreat, evaluatePosition(x, y, { playerOverride: opponentPlayer, defenseOverride: aiPlayer }));
                board[y][x] = 0;
            }

            return maxThreat;
        }

        function describeAIMove(move, score, context = null) {
            if (!move) {
                return '等待本回合分析';
            }

            if (score >= 100000) {
                return '优先选择直接取胜点';
            }

            if (score >= 90000) {
                return '优先封堵对手的直接胜点';
            }

            if (context?.firstMove) {
                const dx = Math.abs(context.firstMove.x - move.x);
                const dy = Math.abs(context.firstMove.y - move.y);
                if (dx <= 2 && dy <= 2) {
                    return '第二子贴近首子，强化局部联动';
                }
                if (context.firstMove.x === move.x || context.firstMove.y === move.y || dx === dy) {
                    return '第二子沿同线扩展，保持连续压迫';
                }
            }

            if (score > 12000) {
                return '兼顾进攻与防守，优先处理高威胁区域';
            }

            if (score > 4000) {
                return '围绕现有棋形扩张，提升后续威胁';
            }

            return '选择局部密度更高的位置，保持棋形稳定';
        }
        
        // 寻找最佳走法
        function findBestMoves(context = null) {
            const moves = [];
            const aiPlayer = getAITurnPlayer();
            const opponentPlayer = aiPlayer === 1 ? 2 : 1;
            const candidateMoves = getCandidateMoves(aiDifficulty === 'hard' ? 16 : 12);
            
            // 1. 检查是否能赢
            for (let y = 0; y < BOARD_SIZE; y++) {
                for (let x = 0; x < BOARD_SIZE; x++) {
                    if (board[y][x] !== 0) continue;
                    board[y][x] = aiPlayer;
                    if (checkWin(x, y, aiPlayer)) {
                        moves.push({ x, y, score: 100000 });
                    }
                    board[y][x] = 0;
                }
            }
            if (moves.length > 0) {
                lastAIDecision = '优先选择直接取胜点';
                return moves;
            }
            
            // 2. 阻止对手获胜
            for (let y = 0; y < BOARD_SIZE; y++) {
                for (let x = 0; x < BOARD_SIZE; x++) {
                    if (board[y][x] !== 0) continue;
                    board[y][x] = opponentPlayer;
                    if (checkWin(x, y, opponentPlayer)) {
                        moves.push({ x, y, score: 90000 });
                    }
                    board[y][x] = 0;
                }
            }
            if (moves.length > 0) {
                lastAIDecision = '优先封堵对手的直接胜点';
                return moves;
            }
            
            // 3. 评估高质量候选空位
            const scoredMoves = candidateMoves.map(({ x, y }) => {
                let score = evaluatePosition(x, y, context);

                if (context?.firstMove) {
                    score += scoreMoveSynergy(x, y, context);
                }

                return { x, y, score };
            });

            if (aiDifficulty === 'hard') {
                scoredMoves.sort((a, b) => b.score - a.score);

                for (let index = 0; index < Math.min(scoredMoves.length, 6); index++) {
                    const move = scoredMoves[index];
                    board[move.y][move.x] = aiPlayer;
                    const responseThreat = evaluateOpponentBestResponse(3);
                    board[move.y][move.x] = 0;

                    if (responseThreat >= 100000) {
                        move.score -= 15000;
                    } else {
                        move.score -= Math.floor(responseThreat * 0.12);
                    }
                }
            }

            for (const move of scoredMoves) {
                if (move.score > 0) {
                    moves.push(move);
                }
            }
            
            // 按分数排序
            moves.sort((a, b) => b.score - a.score);

            if (moves.length > 0) {
                lastAIDecision = describeAIMove(moves[0], moves[0].score, context);
            }
            
            // 根据难度调整选择策略
            let bestMoves = moves;
            if (aiDifficulty === 'easy' && moves.length > 3) {
                // 简单模式：随机选择前3个中的一个
                const randomIndex = Math.floor(Math.random() * 3);
                bestMoves = [moves[randomIndex]];
            } else if (aiDifficulty === 'medium' && moves.length > 2) {
                // 中等模式：随机选择前2个中的一个
                const randomIndex = Math.floor(Math.random() * 2);
                bestMoves = [moves[randomIndex]];
            }
            
            // 如果没有好的走法，随机选择
            if (bestMoves.length === 0) {
                const emptyCells = [];
                for (let y = 0; y < BOARD_SIZE; y++) {
                    for (let x = 0; x < BOARD_SIZE; x++) {
                        if (board[y][x] === 0) {
                            emptyCells.push({ x, y, score: 0 });
                        }
                    }
                }
                if (emptyCells.length > 0) {
                    const randomIndex = Math.floor(Math.random() * emptyCells.length);
                    lastAIDecision = '候选点不足，退化为随机合法落子';
                    return [emptyCells[randomIndex]];
                }
            }
            
            return bestMoves;
        }
        
        // 评估位置
        function evaluatePosition(x, y, context = null) {
            const directions = [[1, 0], [0, 1], [1, 1], [1, -1]];
            const aiPlayer = context?.playerOverride ?? getAITurnPlayer();
            const opponentPlayer = context?.defenseOverride ?? (aiPlayer === 1 ? 2 : 1);
            let attackScore = 0;
            let defenseScore = 0;
            let multiThreats = 0;
            
            for (const [dx, dy] of directions) {
                const attackPattern = evaluateLinePattern(x, y, aiPlayer, dx, dy);
                const defensePattern = evaluateLinePattern(x, y, opponentPlayer, dx, dy);

                attackScore += scorePattern(attackPattern, aiDifficulty, false);
                defenseScore += scorePattern(defensePattern, aiDifficulty, true);

                if (attackPattern.total >= 3 && attackPattern.openEnds > 0) multiThreats++;
                if (defensePattern.total >= 3 && defensePattern.openEnds > 0) multiThreats++;
            }

            let score = attackScore + defenseScore;

            if (multiThreats >= 2) {
                score += aiDifficulty === 'hard' ? 700 : 500;
            }
            
            // 优先选择靠近已有棋子的位置
            let nearPieces = 0;
            for (let dy = -2; dy <= 2; dy++) {
                for (let dx = -2; dx <= 2; dx++) {
                    if (dx === 0 && dy === 0) continue;
                    const nx = x + dx;
                    const ny = y + dy;
                    if (isValid(nx, ny) && board[ny][nx] !== 0) {
                        nearPieces++;
                    }
                }
            }
            score += nearPieces * 6;
            
            // 中心位置加分只在开局阶段更明显
            const centerX = Math.floor(BOARD_SIZE / 2);
            const centerY = Math.floor(BOARD_SIZE / 2);
            const distToCenter = Math.abs(x - centerX) + Math.abs(y - centerY);
            const centerWeight = totalMoveCount < 12 ? 18 : totalMoveCount < 30 ? 8 : 3;
            score += Math.max(0, centerWeight - distToCenter);
            
            return score;
        }
        
        // 更新状态显示
        function updateStatus() {
            const statusEl = document.getElementById('status');
            const moveInfoEl = document.getElementById('moveInfo');
            
            if (gameOver) {
                if (winner) {
                    statusEl.textContent = winner === 1 ? '黑棋获胜！' : '白棋获胜！';
                    statusEl.className = 'status-value winner';
                } else {
                    statusEl.textContent = '平局';
                    statusEl.className = 'status-value';
                }
                moveInfoEl.textContent = '游戏结束';
                updateAIInsight(lastAIDecision);
            } else {
                const isFirstMove = totalMoveCount === 0;
                const movesNeeded = isFirstMove ? 1 : (2 - moveCount);
                
                statusEl.textContent = currentPlayer === 1 ? '黑棋' : '白棋';
                statusEl.className = `status-value ${currentPlayer === 1 ? 'black-turn' : 'white-turn'}`;
                
                if (isBrowsingHistory()) {
                    moveInfoEl.textContent = `历史浏览：第 ${viewedHistoryIndex + 1} 步`;
                    updateAIInsight('当前处于历史浏览模式');
                    return;
                }

                if (gameMode === 'human') {
                    // 人人对战模式
                    if (isFirstMove) {
                        moveInfoEl.textContent = `黑方回合：下 1 子`;
                    } else {
                        moveInfoEl.textContent = `${currentPlayer === 1 ? '黑方' : '白方'}回合：还需下 ${movesNeeded} 子`;
                    }
                } else {
                    // 人机对战模式
                    // 判断当前是谁的回合
                    const turnText = isAITurn() ? 'AI' : '人类';
                    
                    if (isFirstMove) {
                        moveInfoEl.textContent = `${turnText}回合：黑方第一手下 1 子`;
                    } else {
                        moveInfoEl.textContent = `${turnText}回合：还需下 ${movesNeeded} 子`;
                    }
                }

                updateAIInsight(lastAIDecision);
            }
        }
        
        // 更新统计
        function updateStats() {
            let blackCount = 0;
            let whiteCount = 0;
            
            for (let y = 0; y < BOARD_SIZE; y++) {
                for (let x = 0; x < BOARD_SIZE; x++) {
                    if (board[y][x] === 1) blackCount++;
                    else if (board[y][x] === 2) whiteCount++;
                }
            }
            
            document.getElementById('blackCount').textContent = blackCount;
            document.getElementById('whiteCount').textContent = whiteCount;
            document.getElementById('totalMoves').textContent = totalMoveCount;
            document.getElementById('turnCount').textContent = turnNumber;
        }
        
        // 重新开始
        function restartGame() {
            initGame();

            if (isAITurn()) {
                setTimeout(() => aiMove(), 300);
            }

            showMessage('游戏已重置');
        }
        
        // 显示消息
        function showMessage(msg) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideIn 0.3s ease-out reverse';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
        
        // 初始化
        initGame();
    </script>
</body>
</html>
