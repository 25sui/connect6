<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>六子棋 - Connect6</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #8B4513;
            --secondary-color: #D2B48C;
            --accent-color: #CD5C5C;
            --text-color: #333333;
            --light-text: #666666;
            --background: #F5F5DC;
            --board-bg: #DEB887;
            --board-border: #8B4513;
            --shadow: rgba(139, 69, 19, 0.2);
            --shadow-hover: rgba(139, 69, 19, 0.4);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --gold: #FFD700;
            --silver: #C0C0C0;
            --board-shadow: rgba(139, 69, 19, 0.3);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            --border-radius: 16px;
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
            --font-size-xs: 12px;
            --font-size-sm: 14px;
            --font-size-md: 16px;
            --font-size-lg: 18px;
            --font-size-xl: 24px;
            --font-size-xxl: 32px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, var(--background) 0%, #F0E68C 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            animation: backgroundShift 20s ease infinite;
        }
        
        @keyframes backgroundShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><path d="M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z" fill="%238b4513" fill-opacity="0.05" fill-rule="evenodd"/></svg>'),
                radial-gradient(circle at 20% 80%, rgba(210, 180, 140, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(205, 92, 92, 0.1) 0%, transparent 50%);
            opacity: 0.3;
            pointer-events: none;
            animation: patternMove 30s linear infinite;
        }
        
        .game-container {
            display: flex;
            gap: 40px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 32px;
            padding: 40px;
            box-shadow: 
                0 25px 50px var(--shadow),
                inset 0 1px 0 rgba(255, 255, 255, 0.2),
                0 0 0 1px rgba(255, 255, 255, 0.3);
            position: relative;
            max-width: 1200px;
            width: 100%;
            backdrop-filter: blur(10px);
            transition: var(--transition);
        }
        
        .game-container:hover {
            transform: translateY(-5px);
            box-shadow: 
                0 30px 60px var(--shadow-hover),
                inset 0 1px 0 rgba(255, 255, 255, 0.2),
                0 0 0 1px rgba(255, 255, 255, 0.3);
        }
        
        .game-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color), var(--primary-color));
            border-radius: 32px 32px 0 0;
            animation: gradientShift 3s ease infinite;
        }
        
        .game-container::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(139, 69, 19, 0.2), transparent);
        }
        
        .board-section {
            position: relative;
            flex: 0 0 auto;
        }
        
        /* 响应式布局 */
        .game-container {
            display: flex;
            gap: var(--spacing-lg);
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-lg) var(--spacing-md);
            min-height: 100vh;
            align-items: flex-start;
            flex-wrap: wrap;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            box-shadow: var(--glass-shadow);
            border: 1px solid var(--glass-border);
            justify-content: center;
        }
        
        @media (max-width: 900px) {
            .game-container {
                flex-direction: column;
                align-items: center;
                padding: var(--spacing-md) var(--spacing-sm);
            }
            
            .control-panel {
                width: 100%;
                max-width: 400px;
            }
            
            .board-wrapper {
                padding: 20px;
            }
            
            .board {
                grid-template-columns: repeat(19, 28px);
                grid-template-rows: repeat(19, 28px);
            }
            
            .cell {
                width: 28px;
                height: 28px;
            }
            
            .piece {
                width: 24px;
                height: 24px;
            }
        }
        
        @media (max-width: 600px) {
            .board-wrapper {
                padding: 15px;
            }
            
            .board {
                grid-template-columns: repeat(19, 24px);
                grid-template-rows: repeat(19, 24px);
            }
            
            .cell {
                width: 24px;
                height: 24px;
            }
            
            .piece {
                width: 20px;
                height: 20px;
            }
            
            .board-title {
                font-size: 32px;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
        }
        
        .board-header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            padding: 20px 0;
        }
        
        .board-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
        }
        
        .board-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
        }
        
        .board-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 42px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 15px;
            text-shadow: 3px 3px 6px rgba(139, 69, 19, 0.15);
            position: relative;
            display: inline-block;
            animation: titleFloat 4s ease-in-out infinite;
        }
        
        @keyframes titleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        
        .board-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
            border-radius: 2px;
            animation: linePulse 3s ease-in-out infinite;
        }
        
        @keyframes linePulse {
            0%, 100% { width: 60%; opacity: 0.8; }
            50% { width: 80%; opacity: 1; }
        }
        
        .board-subtitle {
            font-size: 16px;
            color: var(--light-text);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 500;
            animation: subtitleFade 4s ease-in-out infinite;
        }
        
        @keyframes subtitleFade {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }
        
        .board-wrapper {
            background: linear-gradient(145deg, #D4A574, #C49A6C);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 
                inset 0 2px 5px rgba(255, 255, 255, 0.3),
                inset 0 -2px 5px rgba(0, 0, 0, 0.2),
                0 20px 40px var(--shadow),
                0 0 0 1px rgba(255, 255, 255, 0.1);
            position: relative;
            transition: var(--transition);
        }
        
        .board-wrapper:hover {
            transform: translateY(-5px);
            box-shadow: 
                inset 0 2px 5px rgba(255, 255, 255, 0.3),
                inset 0 -2px 5px rgba(0, 0, 0, 0.2),
                0 25px 50px var(--shadow-hover),
                0 0 0 1px rgba(255, 255, 255, 0.1);
        }
        
        .board-wrapper::before {
            content: '';
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 18px;
            pointer-events: none;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(0, 0, 0, 0.05));
        }
        
        .board {
            display: grid;
            grid-template-columns: repeat(19, 32px);
            grid-template-rows: repeat(19, 32px);
            gap: 0;
            position: relative;
            background: linear-gradient(145deg, #DEB887, #D2B48C);
            border: 8px solid var(--board-border);
            border-radius: 16px;
            box-shadow: 
                inset 0 0 30px rgba(139, 69, 19, 0.3),
                0 8px 25px rgba(139, 69, 19, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.2);
            overflow: hidden;
            position: relative;
        }
        
        .board::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 9,9, 4px, rgba(255,255,255,0.1) 1px, transparent 0),
                radial-gradient(circle at 9,9, 4px, rgba(0,0,0,0.1) 1px, transparent 0);
            background-size: 18px 18px;
            background-position: 0 0, 9px 9px;
            pointer-events: none;
        }
        
        .board::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(0,0,0,0.05));
            pointer-events: none;
        }
        
        .cell {
            width: 32px;
            height: 32px;
            position: relative;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .cell::before,
        .cell::after {
            content: '';
            position: absolute;
            background: var(--board-border);
            opacity: 0.7;
            transition: var(--transition);
        }
        
        .cell::before {
            width: 1px;
            height: 100%;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
        }
        
        .cell::after {
            width: 100%;
            height: 1px;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
        }
        
        /* 棋盘中心点 */
        .cell:nth-child(181)::before,
        .cell:nth-child(181)::after {
            background: var(--board-border);
            opacity: 1;
        }
        
        .cell:nth-child(181)::before {
            width: 3px;
        }
        
        .cell:nth-child(181)::after {
            height: 3px;
        }
        
        /* 星位点 */
        .cell:nth-child(61)::before,
        .cell:nth-child(61)::after,
        .cell:nth-child(109)::before,
        .cell:nth-child(109)::after,
        .cell:nth-child(253)::before,
        .cell:nth-child(253)::after,
        .cell:nth-child(301)::before,
        .cell:nth-child(301)::after {
            background: var(--board-border);
            opacity: 1;
        }
        
        .cell:nth-child(61)::before,
        .cell:nth-child(109)::before,
        .cell:nth-child(253)::before,
        .cell:nth-child(301)::before {
            width: 2px;
        }
        
        .cell:nth-child(61)::after,
        .cell:nth-child(109)::after,
        .cell:nth-child(253)::after,
        .cell:nth-child(301)::after {
            height: 2px;
        }
        
        .cell:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .cell:hover::before {
            width: 2px;
            background: var(--accent-color);
            opacity: 1;
        }
        
        .cell:hover::after {
            height: 2px;
            background: var(--accent-color);
            opacity: 1;
        }
        
        .piece {
            position: absolute;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            transition: var(--transition);
            animation: placePiece 1s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        
        @keyframes placePiece {
            0% {
                transform: translate(-50%, -50%) scale(0) rotate(0deg);
                opacity: 0;
                box-shadow: 0 0 0 0 rgba(0,0,0,0.5);
            }
            30% {
                transform: translate(-50%, -50%) scale(1.3) rotate(180deg);
                box-shadow: 0 0 25px rgba(0,0,0,0.4);
            }
            60% {
                transform: translate(-50%, -50%) scale(1.1) rotate(540deg);
            }
            100% {
                transform: translate(-50%, -50%) scale(1) rotate(720deg);
                opacity: 1;
                box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            }
        }
        
        .piece.black {
            background: radial-gradient(circle at 30% 30%, #4a4a4a, #000000);
            box-shadow: 
                0 6px 12px rgba(0,0,0,0.6),
                inset -3px -3px 6px rgba(0,0,0,0.6),
                inset 3px 3px 6px rgba(255,255,255,0.15),
                0 0 20px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .piece.black::after {
            content: '';
            position: absolute;
            top: 30%;
            left: 30%;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.3), rgba(255,255,255,0.1));
            pointer-events: none;
        }
        
        .piece.white {
            background: radial-gradient(circle at 30% 30%, #ffffff, #e0e0e0);
            box-shadow: 
                0 6px 12px rgba(0,0,0,0.4),
                inset -3px -3px 6px rgba(0,0,0,0.15),
                inset 3px 3px 6px rgba(255,255,255,0.9),
                0 0 20px rgba(255,255,255,0.6);
            border: 1px solid #ccc;
        }
        
        .piece.white::after {
            content: '';
            position: absolute;
            top: 30%;
            left: 30%;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.8), rgba(255,255,255,0.4));
            pointer-events: none;
        }
        
        .piece:hover {
            transform: translate(-50%, -50%) scale(1.2);
            box-shadow: 
                0 8px 16px rgba(0,0,0,0.7),
                inset -3px -3px 6px rgba(0,0,0,0.6),
                inset 3px 3px 6px rgba(255,255,255,0.15),
                0 0 30px rgba(255, 205, 92, 0.7);
            z-index: 20;
        }
        
        .piece.last-move {
            animation: pulse 2s infinite;
            position: relative;
        }
        
        .piece.last-move::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 14px;
            height: 14px;
            background: var(--accent-color);
            border-radius: 50%;
            opacity: 0.9;
            box-shadow: 0 0 10px var(--accent-color);
            z-index: -1;
        }
        
        .piece.last-move::after {
            content: '';
            position: absolute;
            top: 30%;
            left: 30%;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.8), rgba(255,255,255,0.4));
            pointer-events: none;
            z-index: 1;
        }
        
        @keyframes pulse {
            0%, 100% {
                box-shadow: 
                    0 0 0 0 rgba(205, 92, 92, 0.9),
                    0 6px 12px rgba(0,0,0,0.6),
                    inset -3px -3px 6px rgba(0,0,0,0.6),
                    inset 3px 3px 6px rgba(255,255,255,0.15);
                transform: translate(-50%, -50%) scale(1);
            }
            50% {
                box-shadow: 
                    0 0 0 15px rgba(205, 92, 92, 0),
                    0 8px 16px rgba(0,0,0,0.7),
                    inset -3px -3px 6px rgba(0,0,0,0.6),
                    inset 3px 3px 6px rgba(255,255,255,0.15);
                transform: translate(-50%, -50%) scale(1.1);
            }
        }
        
        .control-panel {
            flex: 1;
            min-width: 280px;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
            max-height: 90vh;
            overflow-y: auto;
            padding-right: var(--spacing-sm);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            box-shadow: var(--glass-shadow);
            border: 1px solid var(--glass-border);
            padding: var(--spacing-md);
        }
        
        .status-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: var(--border-radius);
            padding: var(--spacing-md);
            text-align: center;
            box-shadow: var(--glass-shadow);
            border: 1px solid var(--glass-border);
            position: relative;
            overflow: hidden;
            transition: var(--transition);
            flex-shrink: 0;
        }
        
        .status-card:hover {
            transform: translateY(-5px);
            box-shadow: 
                0 16px 40px var(--shadow-hover),
                inset 0 1px 0 rgba(255, 255, 255, 0.8),
                0 0 0 1px rgba(255, 255, 255, 0.2);
        }
        
        .status-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color), var(--primary-color));
            animation: gradientShift 3s ease infinite;
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .status-label {
            font-size: 14px;
            color: var(--light-text);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 500;
        }
        
        .status-value {
            font-family: 'Noto Serif SC', serif;
            font-size: 32px;
            font-weight: 700;
            padding: 15px 30px;
            border-radius: 12px;
            display: inline-block;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        
        .status-value::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.6s;
        }
        
        .status-value:hover::before {
            left: 100%;
        }
        
        .status-value.black-turn {
            background: linear-gradient(145deg, #333, #000);
            color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .status-value.white-turn {
            background: linear-gradient(145deg, #fff, #e0e0e0);
            color: var(--text-color);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: 2px solid #ddd;
        }
        
        .status-value.winner {
            background: linear-gradient(145deg, #ffd700, #ffed4e);
            color: var(--text-color);
            animation: winnerPulse 1.2s infinite;
        }
        
        @keyframes winnerPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .move-info {
            margin-top: 20px;
            padding: 12px;
            background: rgba(255,255,255,0.6);
            border-radius: 10px;
            font-size: 14px;
            color: var(--light-text);
            border-left: 4px solid var(--accent-color);
        }
        
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .difficulty-selector {
            padding: var(--spacing-md);

                        <div class="timer" id="blackTimer">10:00</div>

                    </div>

                </div>
            </div>

                <div class="difficulty-label">游戏模式</div>

                    <button class="difficulty-btn active" onclick="setGameMode('ai')">人机对战</button>

                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-value" id="blackCount">0</div>
                        <div class="stat-label">黑棋数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="whiteCount">0</div>
                        <div class="stat-label">白棋数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="totalMoves">0</div>
                        <div class="stat-label">总步数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="turnCount">1</div>
                        <div class="stat-label">回合数</div>
                    </div>
                </div>
            </div>
            
            <div class="info-card">
                <div class="info-title">游戏规则</div>
                <ul class="info-list">
                    <li>黑棋先行，第一手只下 1 子</li>
                    <li>之后每方每回合下 2 子</li>
                    <li>先形成六连子者获胜</li>
                    <li>横、竖、斜均可连成</li>
                    <li>点击棋盘格子落子</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        // 游戏配置
        const BOARD_SIZE = 19;
        const WIN_COUNT = 6;
        
        // 游戏状态
        let board = [];
        let currentPlayer = 1; // 1: 黑棋, 2: 白棋
        let gameOver = false;
        let winner = null;
        let moveCount = 0; // 当前回合已下子数
        let totalMoveCount = 0; // 总步数
        let turnNumber = 1; // 回合数
        let lastMove = null; // 最后一步
        let aiDifficulty = 'easy'; // AI难度
        let aiMode = 'local'; // AI模式: local 或 remote
        let moveHistory = []; // 移动历史记录
        let notationEnabled = false; // 棋子标记是否启用
        let firstPlayer = 'human'; // 先手方: human 或 ai
        let gameMode = 'ai'; // 游戏模式: ai 或 human
        
        // 时间限制相关
        let blackTime = 600; // 黑方时间（秒）
        let whiteTime = 600; // 白方时间（秒）
        let timerInterval = null; // 计时器间隔
        let isTimerRunning = false; // 计时器是否运行
        
        // 初始化游戏
        function initGame() {
            board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(0));
            currentPlayer = 1;
            gameOver = false;
            winner = null;
            moveCount = 0;
            totalMoveCount = 0;
            turnNumber = 1;
            lastMove = null;
            moveHistory = [];
            
            // 重置时间
            resetTimer();
            
            renderBoard();
            updateStatus();
            updateStats();
            updateHistory();
            document.getElementById('undoBtn').disabled = true;
        }
        
        // 设置AI难度
        function setDifficulty(difficulty) {
            aiDifficulty = difficulty;
            
            // 更新难度按钮状态
            const buttons = document.querySelectorAll('.difficulty-selector:nth-child(3) .difficulty-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            showMessage(`AI难度已设置为${difficulty === 'easy' ? '简单' : difficulty === 'medium' ? '中等' : '困难'}`);
        }
        
        // 设置游戏模式
        function setGameMode(mode) {
            gameMode = mode;
            
            // 更新模式按钮状态
            const buttons = document.querySelectorAll('.difficulty-selector:nth-child(3) .difficulty-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // 显示AI相关控件
            const aiRelatedElements = document.querySelectorAll('.difficulty-selector:nth-child(4), .difficulty-selector:nth-child(5), #aiBtn');
            if (mode === 'ai') {
                aiRelatedElements.forEach(el => el.style.display = 'block');
            } else {
                aiRelatedElements.forEach(el => el.style.display = 'none');
            }
            
            // 重新开始游戏
            restartGame();
            
            showMessage(`游戏模式已设置为${mode === 'ai' ? '人机对战' : '人人对战'}`);
        }
        
        // 设置AI模式
        function setAIMode(mode) {
            aiMode = mode;
            
            // 更新模式按钮状态
            const buttons = document.querySelectorAll('.difficulty-selector:nth-child(4) .difficulty-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            showMessage(`AI模式已设置为${mode === 'local' ? '本地AI' : '远程C++ AI'}`);
        }
        
        // 设置先后手
        function setFirstPlayer(player) {
            firstPlayer = player;
            
            // 更新按钮状态
            document.getElementById('humanFirstBtn').classList.toggle('active', player === 'human');
            document.getElementById('aiFirstBtn').classList.toggle('active', player === 'ai');
            
            // 重新开始游戏
            restartGame();
            
            showMessage(`先后手已设置为${player === 'human' ? '人类先手' : 'AI先手'}`);
        }
        
        // 更新历史记录
        function updateHistory() {
            const historyList = document.getElementById('historyList');
            historyList.innerHTML = '';
            
            moveHistory.forEach((move, index) => {
                const li = document.createElement('li');
                li.className = 'history-item';
                li.textContent = `第${index + 1}步: ${move.player === 1 ? '黑' : '白'} ${move.x},${move.y}`;
                li.onclick = () => jumpToMove(index);
                historyList.appendChild(li);
            });
            
            // 更新悔棋按钮状态
            document.getElementById('undoBtn').disabled = moveHistory.length === 0;
        }
        
        // 悔棋
        function undoMove() {
            if (moveHistory.length === 0) return;
            
            // 移除最后一步
            const lastMove = moveHistory.pop();
            board[lastMove.y][lastMove.x] = 0;
            
            // 更新游戏状态
            totalMoveCount--;
            
            // 检查是否需要调整回合和玩家
            if (totalMoveCount === 0) {
                currentPlayer = 1;
                moveCount = 0;
                turnNumber = 1;
            } else {
                // 计算当前回合的已下子数
                const isFirstMove = totalMoveCount === 1;
                moveCount = isFirstMove ? 0 : (totalMoveCount % 2 === 0 ? 0 : 1);
                currentPlayer = totalMoveCount % 2 === 0 ? 2 : 1;
                turnNumber = Math.floor(totalMoveCount / 2) + 1;
            }
            
            gameOver = false;
            winner = null;
            
            renderBoard();
            updateStatus();
            updateStats();
            updateHistory();
            showMessage('已悔棋一步');
        }
        
        // 跳转到指定步数
        function jumpToMove(index) {
            // 重置游戏
            initGame();
            
            // 重新应用到指定步数
            for (let i = 0; i <= index; i++) {
                const move = moveHistory[i];
                board[move.y][move.x] = move.player;
                totalMoveCount++;
                lastMove = { x: move.x, y: move.y };
            }
            
            // 更新游戏状态
            const isFirstMove = totalMoveCount === 1;
            moveCount = isFirstMove ? 1 : (totalMoveCount % 2 === 0 ? 0 : 1);
            currentPlayer = totalMoveCount % 2 === 0 ? 2 : 1;
            turnNumber = Math.floor(totalMoveCount / 2) + 1;
            
            renderBoard();
            updateStatus();
            updateStats();
            updateHistory();
            showMessage(`已跳转到第${index + 1}步`);
        }
        
        // 导出棋谱
        function exportGame() {
            const gameData = {
                boardSize: BOARD_SIZE,
                moveHistory: moveHistory,
                currentPlayer: currentPlayer,
                gameOver: gameOver,
                winner: winner,
                totalMoves: totalMoveCount,
                turnNumber: turnNumber,
                timestamp: new Date().toISOString()
            };
            
            const jsonString = JSON.stringify(gameData, null, 2);
            const blob = new Blob([jsonString], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `connect6_game_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            
            URL.revokeObjectURL(url);
            showMessage('棋谱已导出');
        }
        
        // 导入棋谱
        function importGame() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const gameData = JSON.parse(e.target.result);
                        
                        // 验证数据格式
                        if (!gameData.moveHistory || !Array.isArray(gameData.moveHistory)) {
                            throw new Error('无效的棋谱格式');
                        }
                        
                        // 重置游戏
                        initGame();
                        
                        // 应用棋谱数据
                        moveHistory = gameData.moveHistory;
                        totalMoveCount = gameData.totalMoves || moveHistory.length;
                        turnNumber = gameData.turnNumber || Math.floor(totalMoveCount / 2) + 1;
                        currentPlayer = gameData.currentPlayer || (totalMoveCount % 2 === 0 ? 2 : 1);
                        gameOver = gameData.gameOver || false;
                        winner = gameData.winner || null;
                        
                        // 重建棋盘
                        for (const move of moveHistory) {
                            board[move.y][move.x] = move.player;
                        }
                        
                        // 更新界面
                        renderBoard();
                        updateStatus();
                        updateStats();
                        updateHistory();
                        showMessage('棋谱已导入');
                    } catch (error) {
                        showMessage('导入失败: ' + error.message);
                    }
                };
                reader.readAsText(file);
            };
            
            input.click();
        }
        
        // 切换棋子标记
        function toggleNotation() {
            notationEnabled = !notationEnabled;
            renderBoard();
            showMessage(notationEnabled ? '棋子标记已启用' : '棋子标记已禁用');
        }
        
        // 时间限制相关函数
        function resetTimer() {
            // 停止当前计时器
            stopTimer();
            
            // 重置时间
            blackTime = 600;
            whiteTime = 600;
            
            // 更新计时器显示
            updateTimerDisplay();
        }
        
        function startTimer() {
            if (isTimerRunning) return;
            
            isTimerRunning = true;
            timerInterval = setInterval(() => {
                if (currentPlayer === 1) {
                    blackTime--;
                    if (blackTime <= 0) {
                        blackTime = 0;
                        stopTimer();
                        handleTimeout(1);
                    }
                } else {
                    whiteTime--;
                    if (whiteTime <= 0) {
                        whiteTime = 0;
                        stopTimer();
                        handleTimeout(2);
                    }
                }
                updateTimerDisplay();
            }, 1000);
        }
        
        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            isTimerRunning = false;
        }
        
        function updateTimerDisplay() {
            const blackTimerEl = document.getElementById('blackTimer');
            const whiteTimerEl = document.getElementById('whiteTimer');
            
            if (blackTimerEl) {
                blackTimerEl.textContent = formatTime(blackTime);
                blackTimerEl.className = `timer ${blackTime < 10 ? 'warning' : ''}`;
            }
            
            if (whiteTimerEl) {
                whiteTimerEl.textContent = formatTime(whiteTime);
                whiteTimerEl.className = `timer ${whiteTime < 10 ? 'warning' : ''}`;
            }
        }
        
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        function handleTimeout(player) {
            gameOver = true;
            winner = player === 1 ? 2 : 1;
            updateStatus();
            updateStats();
            showMessage(`${player === 1 ? '黑方' : '白方'}超时，对方获胜！`);
        }
        
        // 渲染棋盘
        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            
            for (let y = 0; y < BOARD_SIZE; y++) {
                for (let x = 0; x < BOARD_SIZE; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.x = x;
                    cell.dataset.y = y;
                    
                    if (!gameOver) {
                        cell.onclick = () => handleCellClick(x, y);
                    } else {
                        cell.onclick = null;
                    }
                    
                    if (board[y][x] !== 0) {
                        const piece = document.createElement('div');
                        piece.className = `piece ${board[y][x] === 1 ? 'black' : 'white'}`;
                        if (lastMove && lastMove.x === x && lastMove.y === y) {
                            piece.classList.add('last-move');
                        }
                        
                        // 添加棋子标记
                        if (notationEnabled) {
                            const notation = document.createElement('div');
                            notation.className = 'piece-notation';
                            
                            // 查找该位置的落子顺序
                            const moveIndex = moveHistory.findIndex(move => move.x === x && move.y === y);
                            if (moveIndex !== -1) {
                                notation.textContent = moveIndex + 1;
                                notation.style.color = board[y][x] === 1 ? 'white' : 'black';
                                piece.appendChild(notation);
                            }
                        }
                        
                        cell.appendChild(piece);
                    }
                    
                    boardEl.appendChild(cell);
                }
            }
        }
        
        // 处理点击
        function handleCellClick(x, y) {
            if (gameOver || board[y][x] !== 0) return;
            
            // 人人对战模式：允许任何玩家点击
            if (gameMode === 'human') {
                // 开始当前玩家的计时器
                startTimer();
                makeMove(x, y);
                return;
            }
            
            // 人机对战模式：判断是否是人类回合
            const isHumanTurn = (firstPlayer === 'human' && currentPlayer === 1) || 
                               (firstPlayer === 'ai' && currentPlayer === 2);
            
            if (!isHumanTurn) {
                showMessage('现在是AI回合，请点击"AI走棋"按钮');
                return;
            }
            
            // 开始人类的计时器
            startTimer();
            
            makeMove(x, y);
        }
        
        // 落子
        function makeMove(x, y) {
            // 停止当前计时器
            stopTimer();
            
            board[y][x] = currentPlayer;
            lastMove = { x, y };
            moveCount++;
            totalMoveCount++;
            
            // 记录移动历史
            moveHistory.push({ x, y, player: currentPlayer });
            
            renderBoard();
            updateHistory();
            
            // 检查获胜
            if (checkWin(x, y, currentPlayer)) {
                gameOver = true;
                winner = currentPlayer;
                highlightWinningLine(x, y, currentPlayer);
                updateStatus();
                updateStats();
                showMessage(`${currentPlayer === 1 ? '黑棋' : '白棋'}获胜！`);
                return;
            }
            
            // 检查平局
            if (totalMoveCount >= BOARD_SIZE * BOARD_SIZE) {
                gameOver = true;
                updateStatus();
                updateStats();
                showMessage('平局');
                return;
            }
            
            // 判断是否需要切换玩家
            // 规则：黑方第一手只下1子，之后每方每回合下2子
            const isFirstMove = totalMoveCount === 1;
            const shouldSwitch = isFirstMove || moveCount >= 2;
            
            if (shouldSwitch) {
                currentPlayer = currentPlayer === 1 ? 2 : 1;
                moveCount = 0;
                if (currentPlayer === 1) {
                    turnNumber++;
                }
                
                // 开始对方的计时器
                if (!gameOver) {
                    startTimer();
                }
            } else {
                // 继续当前玩家的计时器
                startTimer();
            }
            
            updateStatus();
            updateStats();
            
            // 如果是AI回合，自动触发
            if (gameMode === 'ai' && currentPlayer === 2 && !gameOver) {
                document.getElementById('aiBtn').disabled = false;
            }
        }
        
        // 检查获胜
        function checkWin(x, y, player) {
            const directions = [
                [1, 0],   // 水平
                [0, 1],   // 垂直
                [1, 1],   // 对角线
                [1, -1]   // 反对角线
            ];
            
            for (const [dx, dy] of directions) {
                let count = 1;
                let positions = [[x, y]];
                
                // 正方向
                let nx = x + dx, ny = y + dy;
                while (isValid(nx, ny) && board[ny][nx] === player) {
                    count++;
                    positions.push([nx, ny]);
                    nx += dx;
                    ny += dy;
                }
                
                // 反方向
                nx = x - dx;
                ny = y - dy;
                while (isValid(nx, ny) && board[ny][nx] === player) {
                    count++;
                    positions.push([nx, ny]);
                    nx -= dx;
                    ny -= dy;
                }
                
                if (count >= WIN_COUNT) {
                    return positions;
                }
            }
            
            return null;
        }
        
        // 检查坐标是否有效
        function isValid(x, y) {
            return x >= 0 && x < BOARD_SIZE && y >= 0 && y < BOARD_SIZE;
        }
        
        // 高亮获胜线
        function highlightWinningLine(x, y, player) {
            const winningPositions = checkWin(x, y, player);
            if (!winningPositions) return;
            
            // 重新渲染，高亮获胜棋子
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            
            for (let y = 0; y < BOARD_SIZE; y++) {
                for (let x = 0; x < BOARD_SIZE; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.x = x;
                    cell.dataset.y = y;
                    
                    if (board[y][x] !== 0) {
                        const piece = document.createElement('div');
                        piece.className = `piece ${board[y][x] === 1 ? 'black' : 'white'}`;
                        
                        // 高亮获胜棋子
                        const isWinning = winningPositions.some(([wx, wy]) => wx === x && wy === y);
                        if (isWinning) {
                            piece.style.boxShadow = '0 0 25px #CD5C5C, 0 0 50px #CD5C5C';
                            piece.style.animation = 'pulse 0.6s infinite';
                        }
                        
                        cell.appendChild(piece);
                    }
                    
                    boardEl.appendChild(cell);
                }
            }
        }
        
        // AI走棋
        function aiMove() {
            // 判断是否是AI的回合
            const isAITurn = (firstPlayer === 'ai' && currentPlayer === 1) || 
                            (firstPlayer === 'human' && currentPlayer === 2);
            
            if (gameOver || !isAITurn) return;
            
            document.getElementById('aiBtn').disabled = true;
            showMessage('AI正在思考...');
            
            // 开始AI的计时器
            startTimer();
            
            if (aiMode === 'local') {
                // 本地AI
                const moves = findBestMoves();
                
                // 下第一子
                if (moves.length > 0) {
                    setTimeout(() => {
                        makeMove(moves[0].x, moves[0].y);
                        
                        // 如果需要下第二子
                        const stillAITurn = (firstPlayer === 'ai' && currentPlayer === 1) || 
                                          (firstPlayer === 'human' && currentPlayer === 2);
                        if (!gameOver && stillAITurn && moveCount < 2) {
                            setTimeout(() => {
                                const moves2 = findBestMoves();
                                if (moves2.length > 0) {
                                    makeMove(moves2[0].x, moves2[0].y);
                                }
                                document.getElementById('aiBtn').disabled = false;
                            }, 800);
                        } else {
                            document.getElementById('aiBtn').disabled = false;
                        }
                    }, 1000);
                }
            } else {
                // 远程C++ AI
                fetchRemoteAIMove();
            }
        }
        
        // 获取远程C++ AI走法
        function fetchRemoteAIMove() {
            // 构建请求数据
            const requestData = {
                board: board,
                player: currentPlayer
            };
            
            // 发送请求到C++服务器
            fetch('http://localhost:8080/ai/move', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(requestData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.move) {
                    // 下第一子
                    makeMove(data.move.p1.x, data.move.p1.y);
                    
                    // 如果需要下第二子
                    if (!gameOver && currentPlayer === 2 && moveCount < 2) {
                        setTimeout(() => {
                            makeMove(data.move.p2.x, data.move.p2.y);
                            document.getElementById('aiBtn').disabled = false;
                        }, 500);
                    } else {
                        document.getElementById('aiBtn').disabled = false;
                    }
                } else {
                    showMessage('远程AI请求失败');
                    document.getElementById('aiBtn').disabled = false;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showMessage('远程AI连接失败，请确保服务器已启动');
                document.getElementById('aiBtn').disabled = false;
            });
        }
        
        // 寻找最佳走法
        function findBestMoves() {
            const moves = [];
            
            // 1. 检查是否能赢
            for (let y = 0; y < BOARD_SIZE; y++) {
                for (let x = 0; x < BOARD_SIZE; x++) {
                    if (board[y][x] === 0) {
                        board[y][x] = 2;
                        if (checkWin(x, y, 2)) {
                            moves.push({ x, y, score: 100000 });
                        }
                        board[y][x] = 0;
                    }
                }
            }
            if (moves.length > 0) return moves;
            
            // 2. 阻止对手获胜
            for (let y = 0; y < BOARD_SIZE; y++) {
                for (let x = 0; x < BOARD_SIZE; x++) {
                    if (board[y][x] === 0) {
                        board[y][x] = 1;
                        if (checkWin(x, y, 1)) {
                            moves.push({ x, y, score: 90000 });
                        }
                        board[y][x] = 0;
                    }
                }
            }
            if (moves.length > 0) return moves;
            
            // 3. 评估所有空位
            for (let y = 0; y < BOARD_SIZE; y++) {
                for (let x = 0; x < BOARD_SIZE; x++) {
                    if (board[y][x] === 0) {
                        const score = evaluatePosition(x, y);
                        if (score > 0) {
                            moves.push({ x, y, score });
                        }
                    }
                }
            }
            
            // 按分数排序
            moves.sort((a, b) => b.score - a.score);
            
            // 根据难度调整选择策略
            let bestMoves = moves;
            if (aiDifficulty === 'easy' && moves.length > 3) {
                // 简单模式：随机选择前3个中的一个
                const randomIndex = Math.floor(Math.random() * 3);
                bestMoves = [moves[randomIndex]];
            } else if (aiDifficulty === 'medium' && moves.length > 2) {
                // 中等模式：随机选择前2个中的一个
                const randomIndex = Math.floor(Math.random() * 2);
                bestMoves = [moves[randomIndex]];
            }
            
            // 如果没有好的走法，随机选择
            if (bestMoves.length === 0) {
                const emptyCells = [];
                for (let y = 0; y < BOARD_SIZE; y++) {
                    for (let x = 0; x < BOARD_SIZE; x++) {
                        if (board[y][x] === 0) {
                            emptyCells.push({ x, y, score: 0 });
                        }
                    }
                }
                if (emptyCells.length > 0) {
                    const randomIndex = Math.floor(Math.random() * emptyCells.length);
                    return [emptyCells[randomIndex]];
                }
            }
            
            return bestMoves;
        }
        
        // 评估位置
        function evaluatePosition(x, y) {
            let score = 0;
            const directions = [[1, 0], [0, 1], [1, 1], [1, -1]];
            
            for (const [dx, dy] of directions) {
                // 评估AI（白棋）的得分
                let aiCount = 0;
                let aiOpen = 0;
                
                for (let dir = -1; dir <= 1; dir += 2) {
                    let nx = x + dx * dir;
                    let ny = y + dy * dir;
                    let count = 0;
                    let open = true;
                    
                    while (isValid(nx, ny) && count < 5) {
                        if (board[ny][nx] === 2) {
                            count++;
                        } else if (board[ny][nx] === 0) {
                            break;
                        } else {
                            open = false;
                            break;
                        }
                        nx += dx * dir;
                        ny += dy * dir;
                    }
                    
                    aiCount += count;
                    if (open) aiOpen++;
                }
                
                // 评估对手（黑棋）的威胁
                let playerCount = 0;
                let playerOpen = 0;
                
                for (let dir = -1; dir <= 1; dir += 2) {
                    let nx = x + dx * dir;
                    let ny = y + dy * dir;
                    let count = 0;
                    let open = true;
                    
                    while (isValid(nx, ny) && count < 5) {
                        if (board[ny][nx] === 1) {
                            count++;
                        } else if (board[ny][nx] === 0) {
                            break;
                        } else {
                            open = false;
                            break;
                        }
                        nx += dx * dir;
                        ny += dy * dir;
                    }
                    
                    playerCount += count;
                    if (open) playerOpen++;
                }
                
                // 根据难度调整计分
                if (aiDifficulty === 'hard') {
                    // 困难模式：更重视进攻
                    if (aiCount >= 4) score += 12000;
                    else if (aiCount === 3) score += 1500;
                    else if (aiCount === 2) score += 150;
                    else if (aiCount === 1) score += 20;
                    
                    if (playerCount >= 4) score += 8000;
                    else if (playerCount === 3) score += 800;
                    else if (playerCount === 2) score += 100;
                } else if (aiDifficulty === 'medium') {
                    // 中等模式：平衡进攻和防守
                    if (aiCount >= 4) score += 10000;
                    else if (aiCount === 3) score += 1000;
                    else if (aiCount === 2) score += 100;
                    else if (aiCount === 1) score += 10;
                    
                    if (playerCount >= 4) score += 6000;
                    else if (playerCount === 3) score += 600;
                    else if (playerCount === 2) score += 60;
                } else {
                    // 简单模式：更重视防守
                    if (aiCount >= 4) score += 8000;
                    else if (aiCount === 3) score += 800;
                    else if (aiCount === 2) score += 80;
                    else if (aiCount === 1) score += 8;
                    
                    if (playerCount >= 4) score += 10000;
                    else if (playerCount === 3) score += 1000;
                    else if (playerCount === 2) score += 100;
                }
            }
            
            // 优先选择靠近已有棋子的位置
            let nearPieces = 0;
            for (let dy = -2; dy <= 2; dy++) {
                for (let dx = -2; dx <= 2; dx++) {
                    if (dx === 0 && dy === 0) continue;
                    const nx = x + dx;
                    const ny = y + dy;
                    if (isValid(nx, ny) && board[ny][nx] !== 0) {
                        nearPieces++;
                    }
                }
            }
            score += nearPieces * 5;
            
            // 中心位置加分
            const centerX = Math.floor(BOARD_SIZE / 2);
            const centerY = Math.floor(BOARD_SIZE / 2);
            const distToCenter = Math.abs(x - centerX) + Math.abs(y - centerY);
            score += Math.max(0, 20 - distToCenter);
            
            return score;
        }
        
        // 更新状态显示
        function updateStatus() {
            const statusEl = document.getElementById('status');
            const moveInfoEl = document.getElementById('moveInfo');
            
            if (gameOver) {
                if (winner) {
                    statusEl.textContent = winner === 1 ? '黑棋获胜！' : '白棋获胜！';
                    statusEl.className = 'status-value winner';
                } else {
                    statusEl.textContent = '平局';
                    statusEl.className = 'status-value';
                }
                moveInfoEl.textContent = '游戏结束';
            } else {
                const isFirstMove = totalMoveCount === 0;
                const movesNeeded = isFirstMove ? 1 : (2 - moveCount);
                
                statusEl.textContent = currentPlayer === 1 ? '黑棋' : '白棋';
                statusEl.className = `status-value ${currentPlayer === 1 ? 'black-turn' : 'white-turn'}`;
                
                if (gameMode === 'human') {
                    // 人人对战模式
                    if (isFirstMove) {
                        moveInfoEl.textContent = `黑方回合：下 1 子`;
                    } else {
                        moveInfoEl.textContent = `${currentPlayer === 1 ? '黑方' : '白方'}回合：还需下 ${movesNeeded} 子`;
                    }
                } else {
                    // 人机对战模式
                    // 判断当前是谁的回合
                    const isAITurn = (firstPlayer === 'ai' && currentPlayer === 1) || 
                                    (firstPlayer === 'human' && currentPlayer === 2);
                    const turnText = isAITurn ? 'AI' : '人类';
                    
                    if (isFirstMove) {
                        moveInfoEl.textContent = `${turnText}回合：黑方第一手下 1 子`;
                    } else {
                        moveInfoEl.textContent = `${turnText}回合：还需下 ${movesNeeded} 子`;
                    }
                }
            }
        }
        
        // 更新统计
        function updateStats() {
            let blackCount = 0;
            let whiteCount = 0;
            
            for (let y = 0; y < BOARD_SIZE; y++) {
                for (let x = 0; x < BOARD_SIZE; x++) {
                    if (board[y][x] === 1) blackCount++;
                    else if (board[y][x] === 2) whiteCount++;
                }
            }
            
            document.getElementById('blackCount').textContent = blackCount;
            document.getElementById('whiteCount').textContent = whiteCount;
            document.getElementById('totalMoves').textContent = totalMoveCount;
            document.getElementById('turnCount').textContent = turnNumber;
        }
        
        // 重新开始
        function restartGame() {
            initGame();
            if (gameMode === 'ai') {
                document.getElementById('aiBtn').disabled = false;
            } else {
                document.getElementById('aiBtn').disabled = true;
            }
            showMessage('游戏已重置');
        }
        
        // 显示消息
        function showMessage(msg) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideIn 0.3s ease-out reverse';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
        
        // 初始化
        initGame();
    </script>
</body>
